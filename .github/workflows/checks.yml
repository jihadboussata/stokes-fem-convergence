name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends freefem++
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run.py --meshes 8 16 --output /tmp/stokes-smoke
